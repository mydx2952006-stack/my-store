<!doctype html><html lang="en"><head><meta charset="utf-8"><title>El Mahdy Admin</title><style>body{font-family:Arial;background:#111;color:#eee;padding:30px}h1{color:#d4af62}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #444;text-align:left}button{padding:7px;background:#d4af62;border:0}</style></head><body><h1>El Mahdy Store — Orders</h1><button onclick="load()">Refresh</button><div id="out"></div><script>async function load(){const orders=await fetch('/api/orders').then(r=>r.json());document.getElementById('out').innerHTML='<table><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Address</th><th>Total</th><th>Status</th></tr>'+orders.map(o=>`<tr><td>${o.id}</td><td>${o.name}</td><td>${o.phone}</td><td>${o.address}, ${o.city}</td><td>EGP ${o.total}</td><td><select onchange="status(${o.id},this.value)"><option ${o.status==='New'?'selected':''}>New</option><option ${o.status==='Processing'?'selected':''}>Processing</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Completed'?'selected':''}>Completed</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></td></tr>`).join('')+'</table>'}async function status(id,status){await fetch('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});}load();</script></body></html>
